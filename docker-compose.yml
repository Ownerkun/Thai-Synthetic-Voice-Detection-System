name: thai-spoof_backend
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ONNX_MODEL_PATH: /models/model.onnx
      ONNX_MODEL_META_PATH: /models/model.json
    volumes:
      # เอาไฟล์โมเดลที่เทรนเสร็จ (model.onnx + model.json) มาวางในโฟลเดอร์นี้บนเครื่อง host
      # container จะอ่านผ่าน path เดียวกันเสมอ ไม่ต้อง build image ใหม่ตอนเปลี่ยนเวอร์ชันโมเดล
      - ./models:/models:ro
    ports:
      - "8000:8000"

  # เปิดใช้ด้วย: docker compose --profile tools up -d
  # เข้าดู/แก้ข้อมูลผ่านหน้าเว็บที่ http://localhost:5050 (จำเป็นเฉพาะตอน dev)
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - path: .env
        required: false
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:

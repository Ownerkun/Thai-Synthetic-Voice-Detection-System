<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15111e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="เช็กว่าเสียงภาษาไทยเป็นเสียงคนจริงหรือเสียงที่สร้างด้วย AI" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="เสียงจริงไหม?" />
    <title>เสียงจริงไหม? — ตรวจเสียง AI</title>
    <script>
      // ตั้งธีมก่อน React render เพื่อไม่ให้จอกระพริบสีผิด (ตรรกะเดียวกับ src/lib/theme.ts)
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('tsvd.theme');
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFAFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171424" media="(prefers-color-scheme: dark)">
<title>เสียงจริงไหม? — ตรวจเสียง AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCFAFF;--surf:#F3EFFC;--line:#E6DFF5;--ink:#2E2A44;--mute:#7E789A;--accent:#8E7CE0;--real:#2E9E78;--fake:#E0626F;--btn:#D3C7F8;--on-btn:#2E2A44;--sky:#D8EDFA;--rose:#FADDE1;--mint:#D6F0E5;--lilac:#E4DCFB;--peach:#FDE6D5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171424;--surf:#221E34;--line:#352F4D;--ink:#EFEBFA;--mute:#A9A2C4;--accent:#B5A6FF;--real:#6FD3A8;--fake:#FF8D98;--btn:#4A3F82;--on-btn:#F3F0FF;--sky:#1F3A4D;--rose:#4A2A33;--mint:#1F4236;--lilac:#3A3066;--peach:#4A3427;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif}
b,strong{font-weight:500}
h1,h2,h3{font-weight:300;margin:0;line-height:1.35}
h1{font-size:clamp(30px,6vw,44px)}h2{font-size:24px}h3{font-size:18px;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:14px}.center{text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.err{color:var(--fake);margin-top:14px}
.ok{color:var(--real);margin-top:14px;display:flex;gap:8px;align-items:center}

/* header + navigation */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.bar>div{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:20px 24px}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:500;margin-right:auto}
.logo{display:flex;align-items:center;gap:3px;height:24px}
.logo i{width:2.5px;border-radius:2px;background:var(--ink)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mute);font-weight:400}
.nav{display:flex;gap:28px}
.nav button{border:0;background:none;color:var(--mute);padding:6px 0;border-bottom:2px solid transparent}
.nav button svg{display:none}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);font-weight:500;border-color:var(--ink)}
.out{border:0;background:none;color:var(--mute);padding:6px 0}
.dock{display:none}
.page{max-width:560px;margin:0 auto;padding:40px 24px 96px}
.page.wide{max-width:960px}
@media(max-width:720px){
  .nav{display:none}
  .bar>div{padding:14px 20px}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mute);font-size:12px;padding:6px 0}
  .dock button.on{color:var(--ink);font-weight:500}
  .page{padding:24px 20px 120px}
}

/* shared parts */
.card{margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font-weight:500}
.btn.block{width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:36px;padding:0 18px;font-size:14px}
.in{width:100%;min-height:48px;padding:10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);font:inherit}
.in:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1px 0 var(--ink)}
textarea.in{min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea.in:focus{box-shadow:none;border-color:var(--ink)}
label.f{display:block;margin-top:20px;color:var(--mute);font-size:14px}
label.f .in{margin-top:2px;color:var(--ink);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin-right:10px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.real{color:var(--real)}.pill.fake{color:var(--fake)}
.seg2{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.seg2 button{border:0;background:none;padding:10px 0;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg2 button.on{color:var(--ink);font-weight:500;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 16px;color:var(--mute)}
.chip svg.i{width:18px;height:18px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.empty{text-align:center;padding:64px 16px;color:var(--mute)}
.iconbtn{border:0;background:none;color:var(--mute);padding:6px;border-radius:10px}
.iconbtn:hover{color:var(--fake)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:48px 24px 200px;position:relative;overflow:hidden}
.lg{width:100%;max-width:400px;position:relative;z-index:1}
.bars{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:flex-end;gap:6px;padding:0 24px;pointer-events:none}
.bars i{flex:1;background:color-mix(in srgb,var(--ink) 11%,var(--bg));border-radius:2px 2px 0 0;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n)*18ms)}
@keyframes rise{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}

/* home */
.stage{margin-top:36px}
.live{display:block;width:100%;height:84px;margin-top:36px}
.timer{font-size:72px;font-weight:200;line-height:1;text-align:center;margin-top:12px}
.rec{position:relative;width:112px;height:112px;border-radius:50%;border:1.5px solid var(--ink);background:none;color:var(--ink);display:grid;place-items:center;margin:28px auto 14px}
.rec:hover{background:var(--surf)}
.rec svg.i{width:34px;height:34px}
.rec.on{border-color:var(--fake);color:var(--fake)}
.rec.on::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--fake);animation:ping 1.5s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.2)}}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:1px dashed var(--line);border-radius:28px;padding:80px 16px;margin-top:32px;cursor:pointer;position:relative}
.drop:hover,.drop:focus-within{border-color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop svg.i{width:32px;height:32px;color:var(--mute)}
.spin{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);margin:20px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result */
.res{--c:var(--real);margin-top:36px}
.res.fake{--c:var(--fake)}
.bignum{font-size:clamp(112px,34vw,200px);font-weight:200;line-height:.95;color:var(--c);letter-spacing:-.04em}
.bignum small{font-size:.26em;font-weight:300;letter-spacing:0;margin-left:.08em}
.vword{font-size:26px;font-weight:500;margin-top:14px}
audio{display:block;width:100%;height:36px;margin-top:28px}
.scope{margin-top:28px}
canvas#wave{display:block;width:100%;height:88px}
.segs{display:flex;gap:4px;margin-top:14px}
.sg{min-width:0}
.sg i{display:block;height:6px;border-radius:3px}
.sg span{display:block;margin-top:6px;font-size:12px;color:var(--mute)}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.choices{display:flex;gap:12px;margin-top:16px}
.choice{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px solid var(--line);background:none;border-radius:999px;font-weight:500}
.choice:hover{border-color:var(--ink)}
.choice.yes.on{background:var(--real);border-color:var(--real);color:var(--bg)}
.choice.no.on{background:var(--fake);border-color:var(--fake);color:var(--bg)}

/* history */
.hlist{margin-top:24px;border-bottom:1px solid var(--line)}
.hrow{--c:var(--real);display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:start;padding:22px 0;border-top:1px solid var(--line)}
.hrow.fake{--c:var(--fake)}
.hrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:11px}
.hrow .g{min-width:0;overflow-wrap:anywhere}
.hrow .sc{text-align:right}
.bigpct{font-size:40px;font-weight:200;line-height:1.1;color:var(--c)}
.cmt{margin-top:10px;padding-left:12px;border-left:2px solid var(--line);font-size:14px;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.dbg{margin-top:16px;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:12px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:560px){.hrow{grid-template-columns:auto 1fr auto}.hrow .iconbtn{grid-column:3;grid-row:2;justify-self:end}}

/* calendar */
.datewrap{position:relative}
.cal{position:absolute;top:calc(100% + 8px);left:0;z-index:6;width:300px;max-width:calc(100vw - 40px);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:16px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg i{font-style:normal;color:var(--mute);font-size:13px;padding:4px 0}
.day{border:0;background:none;border-radius:999px;min-height:36px;color:var(--ink)}
.day:hover{background:var(--surf)}
.day.today{box-shadow:inset 0 0 0 1px var(--ink)}
.day.sel{background:var(--ink);color:var(--bg);font-weight:500}
.calf{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
@media(max-width:720px){.cal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,90vw)}}

/* profile */
.avatar{width:88px;height:88px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:34px;font-weight:200;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.dl{margin:20px 0 0}
.dl div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.dl dt{color:var(--mute)}.dl dd{margin:0;text-align:right;overflow-wrap:anywhere}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{--c:var(--mute);background:none;border:0;color:inherit;text-align:left;padding:24px 0 24px 24px;display:block;width:100%}
.stat:first-child{padding-left:0}
.stat+.stat{border-left:1px solid var(--line)}
button.stat:hover strong{color:var(--accent)}
.stat .k{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.stat .k i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stat strong{display:block;font-size:56px;font-weight:200;line-height:1.1;margin-top:8px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.stat{padding:20px 0 20px 20px}.stat:nth-child(odd){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.ratio{display:flex;height:8px;gap:3px;margin-top:18px}
.ratio button{border:0;min-width:8px;border-radius:4px;padding:0}
.ratio .rf{background:var(--fake)}.ratio .rr{background:var(--real)}
.legend{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;color:var(--mute);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:12px;height:160px;margin-top:20px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:13px;color:var(--mute);height:100%}
.chart i{display:block;width:100%;max-width:28px;background:color-mix(in srgb,var(--ink) 16%,var(--bg));border-radius:4px 4px 0 0;margin:6px 0}
.chart div.today i{background:var(--ink)}
.chart b{color:var(--ink);font-weight:500}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:640px}
th,td{text-align:left;padding:14px 12px 14px 0;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;color:var(--mute);font-weight:400;font-size:13px}
.thbig{font-size:clamp(96px,22vw,140px);font-weight:200;line-height:1;text-align:center;margin-top:20px;letter-spacing:-.04em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--real) 0 var(--x,70%),var(--fake) var(--x,70%) 100%);margin:36px 0 14px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.zones{display:flex;justify-content:space-between;gap:12px;font-size:14px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

/* pastel colour layer */
body{background:linear-gradient(180deg,var(--lilac) 0,var(--bg) 320px) no-repeat,var(--bg)}
.bar{background:color-mix(in srgb,var(--lilac) 90%,transparent);backdrop-filter:blur(8px)}
.btn{box-shadow:none;transition:none}.btn:hover{background:color-mix(in srgb,var(--btn) 80%,var(--accent))}
.btn:hover,.btn:active{transform:none;box-shadow:none}
.btn.ghost{background:var(--surf);border:0}.btn.ghost:hover{background:var(--lilac)}
.chip{background:var(--surf);border-color:transparent}.chip:hover{background:var(--lilac);color:var(--ink)}
.chip.on{background:var(--btn);color:var(--on-btn);border-color:transparent}
.tag{background:var(--surf);border-color:transparent}
.nav button.on,.seg2 button.on{border-color:var(--accent)}
.in{border-bottom-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.in:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
textarea.in{background:var(--surf);border-color:transparent;box-shadow:none}textarea.in:focus{border-color:var(--accent);box-shadow:none}
.drop{background:var(--peach);border:0;color:var(--ink)}.drop:hover{background:color-mix(in srgb,var(--peach) 70%,var(--lilac))}
.drop svg.i{color:var(--accent);border:0;padding:0;background:none;width:32px;height:32px}
.rec{background:var(--rose);border:0;color:var(--fake);width:120px;height:120px;box-shadow:none;transition:none}
.rec:hover,.rec:active{transform:none;box-shadow:none;background:color-mix(in srgb,var(--rose) 70%,var(--lilac))}
.rec.on{background:var(--fake);color:#fff}.rec svg.i{width:34px;height:34px}
.live{background:none;border:0;border-radius:0;height:84px;margin-top:36px}
.timer{font-family:inherit;font-size:72px;font-weight:200}
.stage{padding:0;background:none;border:0;box-shadow:none;margin-top:36px}
.stage .seg2{background:none;padding:0;border:0;border-radius:0;border-bottom:1px solid var(--line);gap:28px}
.seg2{padding:0;border:0;border-radius:0;background:none;border-bottom:1px solid var(--line);gap:28px}
.seg2 button{flex:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;margin-bottom:-1px;background:none;box-shadow:none}
.seg2 button.on{background:none;box-shadow:none;border-color:var(--accent);color:var(--ink)}
.bars i{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.bars i:nth-child(3n){background:color-mix(in srgb,var(--real) 22%,var(--bg))}
.bars i:nth-child(5n){background:color-mix(in srgb,var(--fake) 20%,var(--bg))}
.res{background:color-mix(in srgb,var(--c) 12%,var(--bg));border:0;border-radius:32px;padding:28px 24px 24px;margin:36px -8px 0;box-shadow:none}
.hrow{background:var(--surf);border:0;border-radius:22px;padding:18px 20px;margin-bottom:10px;box-shadow:none}
.hrow.real{background:var(--mint)}.hrow.fake{background:var(--rose)}
.hlist{border-bottom:0}
.cmt{background:color-mix(in srgb,var(--bg) 70%,transparent);border:0;border-radius:12px;padding:8px 12px}
.cal{box-shadow:0 12px 40px rgba(60,40,110,.16);border-color:transparent}
.day.sel{background:var(--btn);color:var(--on-btn)}.day:hover{background:var(--lilac)}.day.today{box-shadow:inset 0 0 0 1px var(--accent)}
.avatar{background:var(--lilac)}
.dock{background:color-mix(in srgb,var(--lilac) 90%,transparent)}.dock button.on{color:var(--accent)}
.stats{border:0;gap:12px}
.stat,.stat:first-child{padding:20px 22px;border:0!important;border-radius:24px;background:var(--surf)}
.stats>:nth-child(1){background:var(--sky)}.stats>:nth-child(2){background:var(--rose)}.stats>:nth-child(3){background:var(--mint)}.stats>:nth-child(4){background:var(--lilac)}
.stat+.stat{border-left:0}
@media(max-width:720px){.stat:nth-child(odd){padding-left:22px}.stat:nth-child(n+3){border-top:0}}
.ratio .rf{background:var(--fake)}.ratio .rr{background:var(--real)}
.chart i{background:color-mix(in srgb,var(--accent) 30%,var(--bg))}.chart div.today i{background:var(--accent)}
.card{margin-top:44px}
input[type=range]{background:linear-gradient(to right,var(--mint) 0 var(--x,70%),var(--rose) var(--x,70%) 100%);height:8px;border:0;margin:36px 0 14px}
input[type=range]::-webkit-slider-thumb{width:26px;height:26px;background:var(--bg);border:3px solid var(--accent);box-shadow:none}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--bg);border:3px solid var(--accent);box-shadow:none}
.thbig{font-family:inherit;font-weight:200;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-top:20px}
.err{background:none;border:0;padding:0;color:var(--fake);border-radius:0}
.ok{background:none;border:0;padding:0;color:var(--real)}

/* shims for features added later (mascot hidden, plain layout) */
.mc,.sticker,.hero::before,.hero::after{display:none}
.logo{display:flex;align-items:center;gap:3px;height:24px;width:auto;border:0;background:none;box-shadow:none;transform:none}
.logo b{display:flex;align-items:center;gap:3px;height:24px}.logo i{width:2.5px;border-radius:2px;background:var(--accent)}
.brand{font-family:inherit}
.hello{display:block}.bubble{background:none;border:0;box-shadow:none;padding:0;margin:0;color:var(--mute);border-radius:0;font-size:16px}
.hero{background:none;border:0;box-shadow:none;padding:0;display:block}
.hero h1{margin:6px 0 0}.hero p{color:var(--mute);margin:14px 0 28px}
.login{display:block;max-width:none;min-height:100vh;padding:48px 24px 200px;position:relative;margin:0}
.login .hero,.login .lg{max-width:400px;margin:0 auto}.login .hero{margin-top:28px;text-align:left}
.lg{position:relative;z-index:1;margin-top:20px}.lg>.brand{display:none}.hero::before{display:none}
.lg .card{margin-top:0;padding:0;border:0;box-shadow:none;background:none}
.login::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--bg)) 0 10px,transparent 10px 20px,color-mix(in srgb,var(--real) 22%,var(--bg)) 20px 30px,transparent 30px 44px,color-mix(in srgb,var(--fake) 20%,var(--bg)) 44px 54px,transparent 54px 70px);-webkit-mask:linear-gradient(0deg,#000,transparent);mask:linear-gradient(0deg,#000,transparent);pointer-events:none;opacity:.8}
.reshead{display:block}.reshead>div{display:flex;flex-direction:column-reverse}

<script>
// ===== ตั้งค่า: แก้ที่อยู่ของ backend ตรงนี้ =====
const API=window.API_BASE||'http://localhost:8000';

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D=d=>d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}),T=d=>d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const store={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const S={fp:0,fpEmail:'',token:null,user:null,role:'user',page:'home',tab:'rec',phase:'idle',cur:null,rec:null,f:{date:'',res:''},reg:false,err:'',msg:'',loading:false,th:.8,hist:[],adet:[],stats:{},thinfo:{}};

S.cal={open:false,y:new Date().getFullYear(),m:new Date().getMonth()};
// ===== ชั้นเรียก API =====
async function api(path,o={}){
  const h={};if(S.token)h.Authorization='Bearer '+S.token;if(o.body)h['Content-Type']='application/json';
  let r;try{r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.form||(o.body?JSON.stringify(o.body):undefined)})}
  catch(e){throw new Error('เชื่อมต่อ API ที่ '+API+' ไม่ได้ ตรวจว่า backend เปิดอยู่และตั้ง CORS ไว้แล้ว')}
  if(r.status==401&&S.token&&!o.noAuthRedirect){logout();throw new Error('เซสชันหมดอายุ โปรดเข้าสู่ระบบใหม่')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){let m=j&&(j.detail||j.message);if(Array.isArray(m))m=m.map(x=>x.msg).join(' ');throw new Error(typeof m=='string'&&m?m:'เกิดข้อผิดพลาด ('+r.status+')')}
  return j}
// ===== แปลงชื่อ field จาก backend เป็นรูปแบบที่ UI ใช้ (ปรับตาม schema จริงได้ที่นี่ที่เดียว) =====
const pick=(o,ks)=>{if(!o)return;for(const k of ks)if(o[k]!==undefined&&o[k]!==null)return o[k]};
const list=j=>Array.isArray(j)?j:(j&&(j.items||j.results||j.data||j.detections||j.history||j.predictions||j.files))||[];
const UU=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function uuidIn(o,d=0){if(!o||typeof o!='object'||d>3)return;const ks=Object.keys(o).filter(k=>!/user|owner|account/i.test(k));
  for(const k of ks)if(typeof o[k]=='string'&&UU.test(o[k])&&/id/i.test(k))return o[k];
  for(const k of ks){const r=uuidIn(o[k],d+1);if(r)return r}}
function deep(o,re,ok,d=0){if(!o||typeof o!='object'||Array.isArray(o)||d>3)return;
  for(const k of Object.keys(o)){const v=o[k];if(re.test(k)&&!/thresh|index|class|version|id$/i.test(k)&&ok(v))return v}
  for(const k of Object.keys(o)){const r=deep(o[k],re,ok,d+1);if(r!==undefined)return r}}
function norm(x){
  const fb0=pick(x,['feedback','user_feedback']),fb=Array.isArray(fb0)?fb0[0]:fb0,lbv=[x.label,x.result,x.prediction,x.verdict,x.result&&x.result.label,x.prediction&&x.prediction.label].find(v=>typeof v=='string'),lb=lbv?lbv.toLowerCase():'',
    th=pick(x,['threshold','threshold_used']),sg0=pick(x,['segment_scores','segments','scores']),sg=Array.isArray(sg0)?sg0:[];
  let sc=pick(x,['spoof_score','score','spoof_probability','probability','mean_probability']);
  if(sc===undefined)sc=deep(x,/spoof|score|prob|confidence/i,v=>typeof v=='number'&&v>=0&&v<=100);
  sc=+sc||0;if(sc>1)sc=sc/100;
  return{id:(v=>UU.test(String(v))?v:uuidIn(x))(pick(x,['id','detection_id','history_id','record_id','uuid'])),raw:x,name:String(pick(x,['filename','file_name','original_filename','name'])||'ไฟล์เสียง').replace(/\.(webm|wav|mp3|m4a|ogg|flac|aac|opus|mp4)$/i,''),score:sc,
    dur:Math.round(+pick(x,['duration_sec','duration','duration_seconds'])||0),at:new Date(pick(x,['created_at','timestamp','detected_at'])||Date.now()),
    agree:pick(x,['user_agrees','agree'])??(fb?pick(fb,['user_agrees','agree']):undefined)??deep(x,/agree/i,v=>typeof v=='boolean')??null,comment:x.comment||(fb&&fb.comment)||deep(x,/comment/i,v=>typeof v=='string'&&v.trim()!=='')||'',scores:sg.map(s=>+(s&&typeof s=='object'?(s.spoof_probability??s.score??s.probability):s)),segs:sg.filter(s=>s&&typeof s=='object'&&s.end_seconds!==undefined).map(s=>({s:+s.start_seconds||0,e:+s.end_seconds||0})),partial:!!x.possible_partial_spoof,maxp:+x.max_probability||0,
    fake:lb?/spoof|fake|synth/.test(lb):undefined,th:th!==undefined?+th:undefined,email:pick(x,['user_email','email'])||(x.user&&x.user.email)||'ผู้เยี่ยมชม'}}

  const y=S.cal.y,m=S.cal.m,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=dk(new Date());

  if(u&&box){box.innerHTML=`<audio controls autoplay src="${u}" aria-label="ฟังเสียงที่ตรวจ"></audio>`;b.remove()}
  else{b.disabled=false;b.innerHTML=old;if(box)box.insertAdjacentHTML('beforeend','<div class="small mute nofile">ไม่พบไฟล์เสียงของรายการนี้ ระบบเก็บเฉพาะผลตรวจ จะฟังได้เฉพาะเสียงที่ตรวจจากเบราว์เซอร์นี้หลังอัปเดตแล้ว</div>')}}
const playBox=d=>d.id?`<div class="pl" id="pl-${d.id}">${S.aurl[d.id]?`<audio controls src="${S.aurl[d.id]}" aria-label="ฟังเสียงที่ตรวจ"></audio>`:`<button class="btn ghost sm" data-play="${d.id}">${ic('play')}ฟังเสียง</button>`}</div>`:'';
const LS={get:id=>{try{return JSON.parse(localStorage.getItem('fb:'+id))}catch(e){return null}},set:(id,v)=>{try{localStorage.setItem('fb:'+id,JSON.stringify(v))}catch(e){}}};
const applyLocal=a=>a.forEach(d=>{const l=d.id&&LS.get(d.id);if(l){if(d.agree===null)d.agree=l.agree;if(!d.comment)d.comment=l.comment}});
async function enrich(a){await Promise.all(a.slice(0,30).filter(d=>d.id).map(async d=>{try{const rawDet=await api('/history/'+d.id),det=norm(rawDet);d.rawDetail=rawDet;
  if(det.score)d.score=det.score;if(det.scores.length)d.scores=det.scores;if(det.agree!==null)d.agree=det.agree;if(det.comment)d.comment=det.comment;if(det.dur)d.dur=det.dur;if(det.fake!==undefined)d.fake=det.fake;if(det.th!==undefined)d.th=det.th;if(det.segs.length)d.segs=det.segs;if(det.maxp)d.maxp=det.maxp;d.partial=det.partial||d.partial}catch(e){}}))}
async function go(p,res){S.cal.open=false;S.page=p;S.f={date:'',res:res||''};S.err='';S.msg='';S.loading=true;render();await load();S.loading=false;render()}
async function enter(tok,adm){
  S.token=tok;S.role=adm?'admin':'user';store.set('tok',tok);store.set('role',S.role);
  S.user=adm?{name:'ผู้ดูแลระบบ',email:'admin'}:await api('/users/me');
  S.page=adm?'dash':'home';S.phase='idle';S.cur=null;S.loading=true;render();await load();S.loading=false}
function logout(){S.token=null;S.user=null;S.page='home';S.phase='idle';S.cur=null;store.set('tok',null);store.set('role',null);render()}

// ===== ตรวจเสียง =====
function pk(x,n){const o=[],st=Math.floor(x.length/n)||1;for(let i=0;i<n;i++){let m=0;for(let j=i*st;j<Math.min(x.length,(i+1)*st);j+=8)m=Math.max(m,Math.abs(x[j]));o.push(m)}const t=Math.max(...o)||1;return o.map(v=>v/t)}
function draw(){const c=$('#wave'),r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);const d=S.cur,P=d.peaks,bw=w/P.length,n=d.scores.length,cs=getComputedStyle(document.documentElement),th=d.th||S.th;
P.forEach((p,i)=>{const tot=n&&d.segs&&d.segs.length==n?d.segs[n-1].e:0,tt=i/P.length*tot;let k=tot?d.segs.findIndex(g=>tt>=g.s&&tt<g.e):-1;if(k<0)k=Math.min(n-1,Math.floor(i/P.length*n));const s=n?d.scores[k]:d.score;g.fillStyle=cs.getPropertyValue(s>=th?'--fake':'--real').trim();const bh=Math.max(4,p*h*.92);g.beginPath();if(g.roundRect)g.roundRect(i*bw+bw*.22,(h-bh)/2,bw*.56,bh,bw*.28);else g.rect(i*bw+bw*.22,(h-bh)/2,bw*.56,bh);g.fill()})}
async function toWav(a){
  const sr=16000,n=Math.max(1,Math.ceil(a.duration*sr)),oc=new OfflineAudioContext(1,n,sr),src=oc.createBufferSource();
  src.buffer=a;src.connect(oc.destination);src.start();
  const x=(await oc.startRendering()).getChannelData(0),buf=new ArrayBuffer(44+x.length*2),v=new DataView(buf),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+x.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,x.length*2,true);
  for(let i=0;i<x.length;i++){const t=Math.max(-1,Math.min(1,x[i]));v.setInt16(44+i*2,t<0?t*32768:t*32767,true)}
  return new Blob([buf],{type:'audio/wav'})}
async function run(blob,name){
  S.err='';S.phase='busy';render();
  try{
    let a,wav;
    try{const ax=new(window.AudioContext||window.webkitAudioContext)();a=await ax.decodeAudioData(await blob.arrayBuffer());ax.close&&ax.close();wav=await toWav(a)}
    catch(e){throw new Error('เบราว์เซอร์อ่านไฟล์เสียงนี้ไม่ได้ ลองไฟล์ .wav หรือ .mp3 ที่ไม่เสียหาย')}
    const fd=new FormData();fd.append('files',wav,name.replace(/\.[^.]+$/,'')+'.wav');
    const j=await api('/predict',{method:'POST',form:fd});console.log('คำตอบจาก /predict',j);
    if(!list(j).length&&!Array.isArray(j)){const ff=j&&j.failed_files;throw new Error('backend ตรวจไฟล์นี้ไม่ได้: '+(ff&&ff.length?JSON.stringify(ff):'ไม่มีผลลัพธ์กลับมา'))}
    const f0=Array.isArray(j)?j[0]:list(j)[0],x=(f0&&typeof f0=='object')?f0:j,d=norm(x);
    d.name=String(name).replace(/\.(webm|wav|mp3|m4a|ogg|flac|aac|opus|mp4)$/i,'');d.url=URL.createObjectURL(blob);d.peaks=pk(a.getChannelData(0),64);if(!d.dur)d.dur=Math.round(a.duration);
    if(d.id){try{const det=norm(await api('/history/'+d.id));if(det.th!==undefined)d.th=det.th;if(det.fake!==undefined)d.fake=det.fake;if(det.scores.length)d.scores=det.scores;if(det.segs.length)d.segs=det.segs}catch(e){}}
    if(d.id)AU.put(d.id,wav);
    S.cur=d;S.phase='done'}
  catch(e){S.phase='idle';S.err=e.message}
  render()}
function drawLive(arr){
  const c=$('#live');if(!c)return;const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;
  c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);
  const n=Math.max(16,Math.floor(w/8)),bw=w/n,cs=getComputedStyle(document.documentElement);g.fillStyle=cs.getPropertyValue(arr?'--accent':'--line').trim();
  for(let i=0;i<n;i++){const v=arr?Math.pow((arr[Math.floor(i/n*arr.length*.6)]||0)/255,1.4):0,bh=Math.max(4,v*h);g.beginPath();if(g.roundRect)g.roundRect(i*bw+bw*.3,(h-bh)/2,bw*.4,bh,2);else g.rect(i*bw+bw*.3,(h-bh)/2,bw*.4,bh);g.fill()}}
async function rec(){
  if(S.rec){S.rec.mr.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];mr.ondataavailable=e=>ch.push(e.data);
    let ac=null,an=null,buf=null;
    try{ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=128;ac.createMediaStreamSource(st).connect(an);buf=new Uint8Array(an.frequencyBinCount)}catch(e){ac=null;an=null}
    const tick=()=>{if(!S.rec)return;if(an){an.getByteFrequencyData(buf);drawLive(buf)}S.rec.raf=requestAnimationFrame(tick)};
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(S.rec.t);cancelAnimationFrame(S.rec.raf);if(ac&&ac.close)ac.close();S.rec=null;run(new Blob(ch,{type:mr.mimeType}),'บันทึกเสียง '+T(new Date())+'.webm')};
    mr.start();S.rec={mr,sec:0,raf:0,t:setInterval(()=>{S.rec.sec++;const e=$('#rt');if(e)e.textContent=mmss(S.rec.sec)},1000)};S.err='';
    render();S.rec.raf=requestAnimationFrame(tick);return}
  catch(e){S.err='เปิดไมโครโฟนไม่ได้ ตรวจสิทธิ์การใช้ไมโครโฟนของเบราว์เซอร์ หรือใช้การอัปโหลดไฟล์แทน'}
  render()}

// ===== เหตุการณ์ =====
const fpErr=x=>/not found|method not allowed|\(404\)|\(405\)/i.test(x.message)?new Error('เซิร์ฟเวอร์ยังไม่มีระบบรีเซ็ตรหัสผ่าน (ต้องเพิ่มฝั่ง backend ก่อน) ตอนนี้ให้ผู้ดูแลช่วยตั้งรหัสใหม่ให้'):x;
const app=$('#app'),guard=async f=>{try{S.err='';await f()}catch(e){S.err=e.message}render()};
app.addEventListener('click',e=>{const b=e.target.closest('button');if(S.cal.open&&!e.target.closest('.datewrap')){S.cal.open=false;render()}if(!b)return;const d=b.dataset;
  if(d.play!==undefined){playAudio(d.play,b);return}
  if(d.eye!==undefined){const i=b.previousElementSibling;i.type=i.type=='password'?'text':'password';b.classList.toggle('on',i.type=='text');return}
  if(d.cal!==undefined){if(d.cal=='toggle'){S.cal.open=!S.cal.open;if(S.cal.open){const t=S.f.date?new Date(S.f.date+'T00:00:00'):new Date();S.cal.y=t.getFullYear();S.cal.m=t.getMonth()}}else{S.cal.m+=+d.cal;if(S.cal.m<0){S.cal.m=11;S.cal.y--}if(S.cal.m>11){S.cal.m=0;S.cal.y++}}return render()}
  if(d.day!==undefined){S.f.date=d.day;S.cal.open=false;return render()}
  if(d.chip!==undefined){S.f.res=d.chip;return render()}
  if(d.go!==undefined)return go(d.go,d.res);
  if(d.role){S.role=d.role;S.err='';return render()}
  if(d.tab){S.tab=d.tab;S.err='';return render()}
  if(d.del)return guard(async()=>{if(!confirm('ลบรายการนี้ออกจากประวัติ'))return;await api('/history/'+d.del,{method:'DELETE'});await load()});
  if(d.ag!==undefined){S.cur.agree=d.ag=='1';S.cur.comment=$('#cm').value;return render()}
  switch(d.act){
    case'fp':S.fp=1;S.err='';render();break;
    case'fpback':S.fp=0;S.err='';render();break;
    case'fpsend':guard(async()=>{const e=$('#fe')?$('#fe').value.trim():S.fpEmail;if(!/^\S+@\S+\.\S+$/.test(e||''))throw new Error('กรอกอีเมลให้ถูกต้องก่อน');S.fpEmail=e;
      try{await api('/auth/forgot-password',{method:'POST',body:{email:e}})}catch(x){throw fpErr(x)}S.fp=2});break;
    case'fpreset':guard(async()=>{const c=$('#fc').value.trim(),p1=$('#f1').value,p2=$('#f2').value;if(!c)throw new Error('ใส่รหัสยืนยันที่ได้รับทางอีเมล');if(p1.length<8)throw new Error('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร');if(p1!==p2)throw new Error('รหัสผ่านใหม่สองช่องไม่ตรงกัน');
      try{await api('/auth/reset-password',{method:'POST',body:{email:S.fpEmail,code:c,token:c,new_password:p1,password:p1}})}catch(x){throw fpErr(x)}S.fp=3});break;
    case'tgl':S.reg=!S.reg;S.err='';render();break;
    case'clr':S.f={date:'',res:''};render();break;
    case'again':S.phase='idle';S.cur=null;S.err='';render();break;
    case'rec':rec();break;
    case'out':logout();break;
    case'send':guard(async()=>{S.cur.comment=$('#cm').value;if(S.cur.agree===null)throw new Error('เลือกก่อนว่าผลนี้ถูกต้องหรือไม่ถูกต้อง');
      if(!S.cur.id){const h=list(await api('/history')).map(norm).sort((a,b)=>b.at-a.at)[0];if(!h||!h.id)throw new Error('หา id ของผลตรวจนี้ไม่เจอ backend ส่ง field: '+Object.keys(S.cur.raw||{}).join(', ')+' | ประวัติมี '+(await api('/history').then(r=>list(r).length).catch(()=>'?'))+' รายการ');S.cur.id=h.id}
      await api('/history/'+S.cur.id+'/feedback',{method:'POST',body:{user_agrees:S.cur.agree,comment:S.cur.comment}});LS.set(S.cur.id,{agree:S.cur.agree,comment:S.cur.comment});S.cur.sent=true});break;
    case'th':guard(async()=>{const v=+$('#rg').value;await api('/admin/threshold',{method:'POST',body:{value:v,threshold:v}});S.msg='บันทึกแล้ว ค่าใหม่ใช้กับการตรวจครั้งต่อไป';await load()});break;
    case'pw':guard(async()=>{const a=$('#p0').value,n=$('#p1').value,c=$('#p2').value;S.msg='';
      if(n.length<8)throw new Error('รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร');if(n!==c)throw new Error('รหัสผ่านใหม่สองช่องไม่ตรงกัน');
      await api('/users/me/password',{method:'PUT',body:{current_password:a,new_password:n}});S.msg='เปลี่ยนรหัสผ่านแล้ว'});break;
    case'in':guard(async()=>{const adm=S.role=='admin',em=$('#em').value.trim(),pw=$('#pw').value;
      const j=await api(adm?'/auth/admin/login':'/auth/login',{method:'POST',noAuthRedirect:true,body:adm?{username:em,password:pw}:{email:em,password:pw}});await enter(j.access_token,adm)});break;
    case'reg':guard(async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(pw.length<8)throw new Error('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร');
      const j=await api('/auth/register',{method:'POST',noAuthRedirect:true,body:{email:em,password:pw}});S.reg=false;await enter(j.access_token,false)});break;
  }});
app.addEventListener('input',e=>{if(e.target.id=='rg'){S.th=+e.target.value;$('#tv').textContent=S.th.toFixed(2);e.target.style.setProperty('--x',((S.th-.5)/.45*100).toFixed(1)+'%')}});
app.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f){S.f[t.dataset.f]=t.value;render()}
  if(t.id=='fi'&&t.files[0])run(t.files[0],t.files[0].name);
  if(t.id=='av'&&t.files[0]){S.user.img=URL.createObjectURL(t.files[0]);render()}});
app.addEventListener('dragover',e=>e.preventDefault());
app.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&S.page=='home'&&S.phase=='idle'&&S.tab=='up')run(f,f.name)});
addEventListener('resize',()=>{if(S.phase=='done'&&$('#wave'))draw();if(!S.rec&&$('#live'))drawLive()});

// เปิดหน้าใหม่แล้ว token ยังอยู่ใน sessionStorage ให้เข้าต่อได้เลย
(async()=>{const t=store.get('tok');render();
  if(t){try{await enter(t,store.get('role')=='admin')}catch(e){logout()}render()}})();
</script>

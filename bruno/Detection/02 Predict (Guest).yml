info:
  name: Predict (Guest)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/predict"
  body:
    type: multipart
    data:
      - name: files
        type: file
        value: ""
  auth: none

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — ผลตรวจสอบเสียง (ไม่บันทึกประวัติ)
    description: Guest request — result not saved to history (saved_to_history = false)
    request:
      url: "{{baseUrl}}/predict"
      method: POST
      body:
        type: multipart
        data:
          - name: files
            type: file
            value: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": [
              {
                "id": "00000000-0000-0000-0000-000000000000",
                "original_filename": "sample.wav",
                "duration_seconds": 3.5,
                "sample_rate": 16000,
                "num_segments": 2,
                "mean_probability": 0.82,
                "max_probability": 0.91,
                "threshold_used": 0.5,
                "verdict": "spoof",
                "possible_partial_spoof": false,
                "model_version": "mock-v0 (real model not yet available)",
                "processing_ms": 120,
                "segments": [
                  {
                    "index": 0,
                    "start_seconds": 0.0,
                    "end_seconds": 2.0,
                    "spoof_probability": 0.91,
                    "is_spoof": true
                  },
                  {
                    "index": 1,
                    "start_seconds": 2.0,
                    "end_seconds": 3.5,
                    "spoof_probability": 0.73,
                    "is_spoof": true
                  }
                ],
                "saved_to_history": false
              }
            ],
            "failed_files": []
          }

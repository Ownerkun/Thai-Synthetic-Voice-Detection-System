info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  variables:
    - name: baseUrl
      value: localhost:8000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 OK (MockSpoofAnalyzer)
    description: Server healthy, using mock model (ONNX not loaded yet)
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "model_version": "mock-v0 (real model not yet available)",
            "using_mock_model": true
          }
  - name: 200 OK (Real ONNX Model)
    description: Server healthy, real ONNX model loaded
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "model_version": "aasist-v1.0",
            "using_mock_model": false
          }

info:
  name: Submit Feedback
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/history/{{detectionId}}/feedback"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_agrees": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created
    description: Test 3 — first feedback for this record; updated_at is null because it has never been edited. Guest users get 401.
    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: POST
      body:
        type: json
        data: |-
          {
            "user_agrees": true
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "id": "<feedback-uuid>",
            "detection_id": "<detection-uuid>",
            "user_agrees": true,
            "created_at": "2026-01-01T00:00:00Z",
            "updated_at": null
          }
  - name: 404 Record Not Found
    description: Record does not exist or belongs to another user
    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: POST
      body:
        type: json
        data: |-
          {
            "user_agrees": true
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "detail": "Record not found"
          }

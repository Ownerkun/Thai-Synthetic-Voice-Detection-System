info:
  name: Get Feedback
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/history/{{detectionId}}/feedback"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: Test 5 — returns the feedback submitted in step 3
    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "<feedback-uuid>",
            "detection_id": "<detection-uuid>",
            "user_agrees": true,
            "created_at": "2026-01-01T00:00:00Z",
            "updated_at": null
          }

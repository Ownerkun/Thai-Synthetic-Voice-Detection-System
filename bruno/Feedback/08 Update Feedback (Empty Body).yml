    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: PUT
      body:
        type: json
        data: |-
          {}
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "type": "missing",
                "loc": ["body", "user_agrees"],
                "msg": "Field required",
                "input": {}
              }
            ]
          }

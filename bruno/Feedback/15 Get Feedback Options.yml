info:
  name: Get Feedback Options
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/feedback/options"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


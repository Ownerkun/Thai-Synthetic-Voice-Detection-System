info:
  name: Get Feedback (No Token)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/history/{{detectionId}}/feedback"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 401 Unauthorized
    description: Test 9 — no Authorization header; must be 401 (not 422 or 404)
    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Authentication required"
          }

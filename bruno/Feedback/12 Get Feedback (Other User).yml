info:
  name: Get Feedback (Other User)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/history/{{detectionId}}/feedback"
  auth:
    type: bearer
    token: "{{otherToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 404 Not Found
    description: Test 10 — logged in as a different user; the record is not theirs, so it looks the same as a missing record
    request:
      url: "{{baseUrl}}/history/{{detectionId}}/feedback"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "detail": "Record not found"
          }

info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/users/me/password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "SecurePass1!",
        "new_password": "NewSecurePass2!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "204 No Content"
    description: "Password changed — log in again with the new password (no response body)"
    request:
      url: "{{baseUrl}}/users/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "SecurePass1!",
            "new_password": "NewSecurePass2!"
          }
    response:
      status: 204
      statusText: "No Content"
  - name: "400 Bad Request"
    description: "Current password is wrong — nothing changed (token is still valid, do not log the user out)"
    request:
      url: "{{baseUrl}}/users/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "SecurePass1!",
            "new_password": "NewSecurePass2!"
          }
    response:
      status: 400
      statusText: "Bad Request"
      body:
        type: json
        data: |-
          {
            "detail": "Current password is incorrect"
          }
  - name: "401 Unauthorized"
    description: "Missing token, admin token, or suspended account"
    request:
      url: "{{baseUrl}}/users/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "SecurePass1!",
            "new_password": "NewSecurePass2!"
          }
    response:
      status: 401
      statusText: "Unauthorized"
      body:
        type: json
        data: |-
          {
            "detail": "Authentication required"
          }
  - name: "422 Unprocessable Entity"
    description: "New password shorter than 8 characters, same as the current one, or a field missing"
    request:
      url: "{{baseUrl}}/users/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "SecurePass1!",
            "new_password": "short"
          }
    response:
      status: 422
      statusText: "Unprocessable Entity"
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "type": "string_too_short",
                "loc": ["body", "new_password"],
                "msg": "String should have at least 8 characters"
              }
            ]
          }

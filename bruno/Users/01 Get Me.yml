info:
  name: Get Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 OK"
    description: "Own account (no password_hash)"
    request:
      url: "{{baseUrl}}/users/me"
      method: GET
    response:
      status: 200
      statusText: "OK"
      body:
        type: json
        data: |-
          {
            "id": "<user-uuid>",
            "email": "user@example.com",
            "display_name": "Somchai",
            "created_at": "2026-10-23T08:23:00"
          }
  - name: "401 Unauthorized"
    description: "Missing token, admin token, or suspended account"
    request:
      url: "{{baseUrl}}/users/me"
      method: GET
    response:
      status: 401
      statusText: "Unauthorized"
      body:
        type: json
        data: |-
          {
            "detail": "Authentication required"
          }

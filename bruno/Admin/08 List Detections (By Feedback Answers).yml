info:
  name: List Detections (By Feedback Answers)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/admin/detections"
  params:
    - name: feedback
      value: "disagree"
    - name: audio_source
      value: "speaker_replay"
    - name: audio_issue
      value: "echo"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 OK"
    description: "Results users disagreed with that were played through a speaker and ticked 'echo' (same item shape as List Detections)"
    request:
      url: "{{baseUrl}}/admin/detections"
      method: GET
    response:
      status: 200
      statusText: "OK"
      body:
        type: json
        data: |-
          {
            "items": [],
            "total": 0,
            "limit": 50,
            "offset": 0
          }
  - name: "422 Unprocessable Entity"
    description: "audio_source / environment / audio_issue / truth_basis / speaker_accent / speaker_age_group not in the options"
    request:
      url: "{{baseUrl}}/admin/detections"
      method: GET
    response:
      status: 422
      statusText: "Unprocessable Entity"
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "type": "literal_error",
                "loc": ["query", "audio_source"],
                "msg": "Input should be 'direct_voice', 'speaker_replay', 'phone_call', 'chat_voice_message', 'shared_media' or 'other'"
              }
            ]
          }

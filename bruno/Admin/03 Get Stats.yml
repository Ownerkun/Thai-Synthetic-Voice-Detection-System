info:
  name: Get Stats
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/stats"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: System-wide statistics overview
    request:
      url: "{{baseUrl}}/admin/stats"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "total_detections": 142,
            "total_spoof_verdicts": 98,
            "total_real_verdicts": 44,
            "total_users": 15,
            "feedback_agreement_rate": 0.73
          }
  - name: 200 OK — ยังไม่มี feedback
    description: feedback_agreement_rate is null when no feedback exists yet
    request:
      url: "{{baseUrl}}/admin/stats"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "total_detections": 5,
            "total_spoof_verdicts": 3,
            "total_real_verdicts": 2,
            "total_users": 2,
            "feedback_agreement_rate": null
          }
  - name: 403 Forbidden
    description: Regular user token cannot access admin endpoints
    request:
      url: "{{baseUrl}}/admin/stats"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "detail": "Insufficient permissions"
          }

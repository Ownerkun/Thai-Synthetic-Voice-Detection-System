info:
  name: Get Threshold
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/threshold"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — threshold ปัจจุบัน
    description: Returns the latest threshold setting
    request:
      url: "{{baseUrl}}/admin/threshold"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "<uuid>",
            "value": 0.5,
            "effective_from": "2026-01-01T00:00:00Z",
            "changed_by_admin_id": "<admin-uuid>",
            "note": "initial threshold"
          }
  - name: 200 OK — ยังไม่มี threshold
    description: No threshold set yet (null response)
    request:
      url: "{{baseUrl}}/admin/threshold"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: "null"
  - name: 401 Unauthorized
    request:
      url: "{{baseUrl}}/admin/threshold"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Authentication required"
          }

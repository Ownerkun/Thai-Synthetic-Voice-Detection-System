info:
  name: List Detections (Filtered)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/detections"
  params:
    - name: verdict
      value: "spoof"
    - name: date_from
      value: "2026-10-01"
    - name: date_to
      value: "2026-10-31"
    - name: guest
      value: "false"
    - name: feedback
      value: "disagree"
    - name: min_prob
      value: "0.6"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 OK"
    description: "Spoof verdicts in Oct 2026 from logged-in users whose feedback was disagree, mean_probability >= 0.6"
    request:
      url: "{{baseUrl}}/admin/detections"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "items": [
              {
                  "id": "<detection-uuid>",
                  "created_at": "2026-10-22T09:16:43",
                  "original_filename": "call_recording.wav",
                  "duration_seconds": 3.0,
                  "num_segments": 1,
                  "mean_probability": 0.82,
                  "max_probability": 0.9,
                  "threshold_used": 0.5,
                  "verdict": "spoof",
                  "possible_partial_spoof": false,
                  "model_version": "<model-version>",
                  "processing_ms": 600,
                  "user_id": "<user-uuid>",
                  "user_email": "somchai@example.com",
                  "feedback": "disagree"
                }
            ],
            "total": 1,
            "limit": 50,
            "offset": 0
          }
  - name: "401 Unauthorized"
    description: "Missing token or a regular user token"
    request:
      url: "{{baseUrl}}/admin/detections"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Insufficient permissions"
          }
  - name: "422 Unprocessable Entity"
    description: "Invalid sort / order / verdict / feedback, from after to, min_prob after max_prob, unknown parameter"
    request:
      url: "{{baseUrl}}/admin/detections"
      method: GET
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "type": "literal_error",
                "loc": ["query", "sort"],
                "msg": "Input should be 'created_at', 'mean_probability' or 'processing_ms'"
              }
            ]
          }

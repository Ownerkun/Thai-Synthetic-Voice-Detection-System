info:
  name: Filter Options
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/admin/detections/filter-options"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 OK"
    description: "Every model_version and the threshold_used range in the whole database (not limited to the 200-row page of List Detections)"
    request:
      url: "{{baseUrl}}/admin/detections/filter-options"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 253,
            "model_versions": [
              {
                "value": "v1.0",
                "count": 251,
                "last_used_at": "2026-11-19T04:12:30.512301Z"
              },
              {
                "value": "mock-v0 (real model not yet available)",
                "count": 2,
                "last_used_at": "2026-10-02T09:00:00Z"
              }
            ],
            "threshold_used": {
              "min": 0.45,
              "max": 0.7
            }
          }
  - name: "401 Unauthorized"
    description: "No admin token (or a normal user's token)"
    request:
      url: "{{baseUrl}}/admin/detections/filter-options"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "Insufficient permissions"
          }

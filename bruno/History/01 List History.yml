info:
  name: List History
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/history"
  params:
    - name: limit
      value: "50"
      description: "Max records to return (1–200)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: Returns list of user's detection records, newest first
    request:
      url: "{{baseUrl}}/history"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          [
            {
              "id": "<detection-uuid>",
              "original_filename": "sample.wav",
              "duration_seconds": 3.5,
              "verdict": "spoof",
              "mean_probability": 0.82,
              "created_at": "2026-01-01T00:00:00Z"
            }
          ]
  - name: 401 Unauthorized
    description: Missing or invalid token
    request:
      url: "{{baseUrl}}/history"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Authentication required"
          }

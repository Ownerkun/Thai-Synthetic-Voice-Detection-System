examples:
  - name: 200 OK
    description: Full detection record including segment scores
    request:
      url: "{{baseUrl}}/history/{{detectionId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": "<detection-uuid>",
            "original_filename": "sample.wav",
            "duration_seconds": 3.5,
            "verdict": "spoof",
            "mean_probability": 0.82,
            "max_probability": 0.91,
            "threshold_used": 0.5,
            "model_version": "mock-v0 (real model not yet available)",
            "processing_ms": 120,
            "created_at": "2026-01-01T00:00:00Z",
            "segments": [
              {
                "index": 0,
                "start_seconds": 0.0,
                "end_seconds": 2.0,
                "spoof_probability": 0.91,
                "is_spoof": true
              }
            ]
          }
  - name: 404 Not Found
    description: Record does not exist or belongs to another user
    request:
      url: "{{baseUrl}}/history/{{detectionId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "detail": "Record not found"
          }

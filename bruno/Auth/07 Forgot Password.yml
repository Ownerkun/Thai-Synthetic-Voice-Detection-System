info:
  name: Forgot Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 202 Accepted
    description: "ตอบเหมือนกันทุกกรณี ไม่บอกว่าอีเมลนี้มีในระบบหรือไม่"
    request:
      url: "{{baseUrl}}/auth/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com"
          }
    response:
      status: 202
      statusText: Accepted
      body:
        type: json
        data: |-
          {
            "detail": "If this email is registered, a password reset link has been sent"
          }

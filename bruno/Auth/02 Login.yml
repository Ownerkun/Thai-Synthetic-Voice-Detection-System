info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "SecurePass1!"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 OK
    description: "เข้าสู่ระบบสำเร็จ — คัดลอก access_token ไปใส่ตัวแปร \"token\" ของ environment"
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "SecurePass1!"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "<jwt_token>",
            "token_type": "bearer"
          }
  - name: 401 Invalid Credentials
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "wrongpassword"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Invalid email or password"
          }
  - name: 403 Email Not Verified
    description: "รหัสผ่านถูก แต่ยังไม่ได้กดลิงก์ยืนยันอีเมล"
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "SecurePass1!"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "detail": "Email not verified"
          }
  - name: 403 Account Suspended
    description: "รหัสผ่านถูก แต่บัญชีถูกระงับ"
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "SecurePass1!"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "detail": "Account suspended"
          }

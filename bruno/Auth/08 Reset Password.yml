info:
  name: Reset Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{emailToken}}",
        "new_password": "NewSecurePass1!"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: "ตั้งรหัสผ่านใหม่สำเร็จ — token เก่าทั้งหมดของบัญชีนี้ใช้ไม่ได้ ต้อง login ใหม่"
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "<token จากลิงก์ในอีเมล>",
            "new_password": "NewSecurePass1!"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "detail": "Password updated. Please log in with your new password"
          }
  - name: 400 Invalid or Expired
    description: "โทเคนผิด / หมดอายุ / ใช้ไปแล้ว"
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "not-a-real-token",
            "new_password": "NewSecurePass1!"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "detail": "Invalid or expired token"
          }

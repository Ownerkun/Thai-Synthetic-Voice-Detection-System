info:
  name: Verify Email
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{emailToken}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: "ยืนยันสำเร็จ ได้ access_token เข้าสู่ระบบทันที (ใส่โทเคนจากลิงก์ในอีเมลที่ตัวแปร emailToken)"
    request:
      url: "{{baseUrl}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "<token จากลิงก์ในอีเมล>"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "<jwt_token>",
            "token_type": "bearer"
          }
  - name: 400 Invalid or Expired
    description: "โทเคนผิด / หมดอายุ / ใช้ไปแล้ว"
    request:
      url: "{{baseUrl}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "not-a-real-token"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "detail": "Invalid or expired token"
          }
  - name: 403 Account Suspended
    description: "บัญชีถูกระงับ ยืนยันอีเมลได้ แต่ไม่ออก token"
    request:
      url: "{{baseUrl}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "<token จากลิงก์ในอีเมล>"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "detail": "Account suspended"
          }

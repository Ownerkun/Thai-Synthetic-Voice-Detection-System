info:
  name: Admin Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/admin/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "AdminPassword1!"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    description: Admin login successful — copy access_token into the "adminToken" environment variable
    request:
      url: "{{baseUrl}}/auth/admin/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "admin",
            "password": "AdminPassword1!"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "<jwt_token>",
            "token_type": "bearer"
          }
  - name: 401 Invalid Credentials
    request:
      url: "{{baseUrl}}/auth/admin/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "admin",
            "password": "wrongpassword"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "detail": "Invalid username or password"
          }

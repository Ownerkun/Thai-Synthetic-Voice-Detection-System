info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "SecurePass1!",
        "display_name": "Test User"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created
    description: "สมัครสำเร็จ ยังไม่มี token ต้องกดลิงก์ในอีเมลก่อน (dev: ดูลิงก์ใน docker compose logs api)"
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "SecurePass1!",
            "display_name": "Test User"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "detail": "Verification email sent. Please check your inbox to activate your account."
          }
  - name: 409 Email Already in Use
    description: "อีเมลซ้ำ"
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "SecurePass1!"
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "detail": "Email already in use"
          }
